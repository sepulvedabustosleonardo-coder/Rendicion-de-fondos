<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rendiciones">
<title>Rendición de Fondos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: single-column mobile app, sticky top bar, cards only for gastos; amounts in mono like a cash ledger */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f5f8f8; --fg:#13232a; --muted:#5a6b72; --line:#d5dfe1;
  --accent:#0b6e69; --accent-fg:#ffffff; --accent-soft:#d8eeec;
  --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b4302a; --bad-soft:#f9e1df; --good:#1e7a3c; --good-soft:#dff2e5;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1719; --surface:#162226; --surface-2:#1c2a2f; --fg:#e4ecee; --muted:#93a6ac; --line:#2a3b40;
  --accent:#3fb3aa; --accent-fg:#06201e; --accent-soft:#183b39;
  --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f08a83; --bad-soft:#3d1d1b; --good:#6fd08f; --good-soft:#163522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1719; --surface:#162226; --surface-2:#1c2a2f; --fg:#e4ecee; --muted:#93a6ac; --line:#2a3b40;
  --accent:#3fb3aa; --accent-fg:#06201e; --accent-soft:#183b39;
  --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f08a83; --bad-soft:#3d1d1b; --good:#6fd08f; --good-soft:#163522; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;min-height:56px}
header.top h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:10px;height:38px;min-width:38px;padding:0 10px;font:inherit;font-size:14px;cursor:pointer}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-fg);font-size:15px;text-align:center}
.btn.sec{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 -6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--fg);width:100%}
.field textarea{min-height:64px;resize:vertical}
.field.filled input,.field.filled select,.field.filled textarea{border-color:var(--accent);background:var(--accent-soft)}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.summary div{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.summary span{font-size:12px;color:var(--muted)}
.summary b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.saldo{border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.saldo.dev{background:var(--warn-soft);color:var(--warn)}
.saldo.reem{background:var(--accent-soft);color:var(--accent)}
.saldo.ok{background:var(--good-soft);color:var(--good)}
.list{display:flex;flex-direction:column;gap:8px}
.grp{font-size:13px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;margin-top:4px}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;color:var(--fg);width:100%}
.item .thumb{width:56px;height:56px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);overflow:hidden;text-align:center;line-height:1.15}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.item .meta strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rend{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;color:var(--fg);width:100%}
.rend .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rend .l1 strong{min-width:0;overflow-wrap:anywhere}
.rend small{color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.fab{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:6}
.fab .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.fab .in .btn{flex:1}
.photo{display:flex;flex-direction:column;gap:10px}
.photo .prev{border-radius:10px;border:1px dashed var(--line);background:var(--surface-2);min-height:150px;display:grid;place-items:center;color:var(--muted);overflow:hidden;text-align:center;padding:8px}
.photo .prev img{max-height:320px;width:auto;max-width:100%;display:block}
.photo .btns{display:flex;gap:10px;flex-wrap:wrap}
.photo .btns label{flex:1;min-width:140px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ai{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500}
.ai span{flex:1;min-width:160px}
.ai.bad{background:var(--bad-soft);color:var(--bad)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 0.8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto}
.sheet header.top{top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:14px;max-width:100%}
.tag span{overflow-wrap:anywhere}
.tag button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.exports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.firma{background:#fff;border:1px dashed var(--line);border-radius:10px;min-height:90px;display:grid;place-items:center;color:#5a6b72;overflow:hidden}
.firma img{max-height:110px;max-width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);color:var(--fg);padding:11px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>

<header class="top"><div class="in" id="topbar"></div></header>
<main class="wrap" id="app"></main>
<div class="fab" id="fab" hidden><div class="in" id="fabin"></div></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

/* Rellena la plantilla "Formato nueva Rendición.xlsx" editando el XML directamente (conserva logo, estilos y formato). */

  {key:'comb_f',first:16,last:43,total:44,boleta:false},
  {key:'comb_b',first:50,last:54,total:55,boleta:true},
  {key:'alim_f',first:60,last:84,total:85,boleta:false},

function xmlEsc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')}
function colNum(col){let n=0;for(const ch of col)n=n*26+(ch.charCodeAt(0)-64);return n}

/* data = {trabajador, numero, proyecto, monto, fechaEntrega, fechaRendicion, secciones:{key:[{casa,fecha,numero,monto,obs}]}, firma: Uint8Array|null} */
async function llenarPlantilla(JSZip, plantilla, data){
  const zip=await JSZip.loadAsync(plantilla);
  let s=await zip.file('xl/worksheets/sheet1.xml').async('string');

  // cuántas filas extra necesita cada sección
  const extra={};SECCIONES.forEach(sec=>{const n=(data.secciones[sec.key]||[]).length;const cap=sec.last-sec.first+1;extra[sec.key]=Math.max(0,n-cap)});
  const shiftOf=row=>SECCIONES.reduce((a,sec)=>a+(row>=sec.last+1?extra[sec.key]:0),0);
  const totalExtra=SECCIONES.reduce((a,sec)=>a+extra[sec.key],0);

  // separar filas
  const start=s.indexOf('<sheetData>')+'<sheetData>'.length,end=s.indexOf('</sheetData>');
  const body=s.slice(start,end);
  const rows=[];const re=/<row [^>]*?\br="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g;let m;
  while((m=re.exec(body)))rows.push({n:+m[1],xml:m[0]});
  const renum=(xml,from,to)=>xml.replace(/^<row ([^>]*?)\br="\d+"/,`<row $1r="${to}"`).replace(new RegExp(`(<c r="[A-Z]+)${from}"`,'g'),`$1${to}"`);
  const map=new Map();
  for(const r of rows){const t=r.n+shiftOf(r.n);map.set(t,t===r.n?r.xml:renum(r.xml,r.n,t))}
  // filas nuevas (copias de la última fila de datos de la sección)
  for(const sec of SECCIONES){const k=extra[sec.key];if(!k)continue;
    const tpl=rows.find(r=>r.n===sec.last).xml;const base=sec.last+shiftOf(sec.last);
    for(let i=1;i<=k;i++)map.set(base+i,renum(tpl,sec.last,base+i))}

  // helpers de celda
  const setCell=(ref,kind,val)=>{
    const rn=+ref.match(/\d+/)[0];let xml=map.get(rn);if(!xml)return;
    const cellRe=new RegExp(`<c r="${ref}"([^>]*?)(?:/>|>[\\s\\S]*?</c>)`);
    let attrs='';const cm=xml.match(cellRe);
    if(cm)attrs=(cm[1].match(/\ss="\d+"/)||[''])[0];
    let cell;
    if(kind==='str')cell=val===''||val==null?`<c r="${ref}"${attrs}/>`:`<c r="${ref}"${attrs} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(val)}</t></is></c>`;
    else if(kind==='num')cell=`<c r="${ref}"${attrs}><v>${+val||0}</v></c>`;
    else cell=`<c r="${ref}"${attrs}><f>${val.f}</f><v>${+val.v||0}</v></c>`;
    if(cm)xml=xml.replace(cellRe,cell);
    else{ // insertar en orden de columna
      const col=colNum(ref.match(/[A-Z]+/)[0]);const cells=[...xml.matchAll(/<c r="([A-Z]+)\d+"/g)];
      const after=cells.find(c=>colNum(c[1])>col);
      if(after)xml=xml.slice(0,after.index)+cell+xml.slice(after.index);
      else xml=xml.replace(/<\/row>$/,cell+'</row>').replace(/\/>$/,'>'+cell+'</row>');
    }
    map.set(rn,xml);
  };
  const unhide=rn=>{const x=map.get(rn);if(x)map.set(rn,x.replace(/^(<row [^>]*?)\shidden="1"/,'$1'))};

  // encabezado
  setCell('C6','str',data.trabajador);
  setCell('F6','str',data.numero);
  setCell('C7','str',data.proyecto);
  setCell('C8','num',data.monto);
  setCell('C9','str',data.fechaEntrega);
  setCell('C10','str',data.fechaRendicion);

  // secciones
  const pos={};let totalB=0,totalF=0,totalAll=0;
  for(const sec of SECCIONES){
    const first=sec.first+shiftOf(sec.first),last=sec.last+shiftOf(sec.last)+extra[sec.key],total=sec.total+shiftOf(sec.total);
    pos[sec.key]={first,last,total};
    const items=data.secciones[sec.key]||[];let sum=0;
    items.forEach((it,i)=>{const r=first+i;unhide(r);
      setCell('A'+r,'num',i+1);setCell('B'+r,'str',it.casa);setCell('C'+r,'str',it.fecha);
      setCell('D'+r,'str',it.numero);setCell('E'+r,'num',it.monto);setCell('F'+r,'str',it.obs);sum+=+it.monto||0});
    for(let r=first+items.length;r<=last;r++){const x=map.get(r);if(x&&r>sec.last+shiftOf(sec.last))setCell('A'+r,'num',r-first+1)}
    setCell('E'+total,'f',{f:`SUM(E${first}:E${last})`,v:sum});
    totalAll+=sum;if(sec.boleta)totalB+=sum;else totalF+=sum;
  }
  const P=k=>'E'+pos[k].total;
  const R=n=>n+shiftOf(n);
  const fB=SECCIONES.filter(x=>x.boleta).map(x=>P(x.key)).join('+');
  const fF=SECCIONES.filter(x=>!x.boleta).map(x=>P(x.key)).join('+');
  const fAll=SECCIONES.map(x=>P(x.key)).join('+');
  setCell('D'+R(189),'f',{f:fB,v:totalB});
  setCell('D'+R(190),'f',{f:fF,v:totalF});
  setCell('D'+R(191),'f',{f:'C8',v:data.monto});
  setCell('D'+R(192),'f',{f:fAll,v:totalAll});
  setCell('C11','f',{f:`D${R(191)}-D${R(192)}`,v:(+data.monto||0)-totalAll});

  const newBody=[...map.keys()].sort((a,b)=>a-b).map(k=>map.get(k)).join('');
  s=s.slice(0,start)+newBody+s.slice(end);

  // combinar celdas, saltos de página, dimensión
  s=s.replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g,(_,c1,r1,c2,r2)=>`<mergeCell ref="${c1}${R(+r1)}:${c2}${R(+r2)}"/>`);
  s=s.replace(/<brk id="(\d+)"/g,(_,id)=>`<brk id="${R(+id)}"`);
  s=s.replace(/<dimension ref="A1:([A-Z]+)(\d+)"\/>/,(_,c,r)=>`<dimension ref="A1:${c}${+r+totalExtra}"/>`);
  s=s.replace(/<sheetView ([^>]*?)topLeftCell="[^"]*"/,'<sheetView $1topLeftCell="A1"').replace(/<selection [^>]*\/>/,'<selection activeCell="C6" sqref="C6"/>');
  zip.file('xl/worksheets/sheet1.xml',s);

  // firma: anclaje desplazado y la imagen del trabajador (o en blanco)
  if(zip.file('xl/drawings/drawing1.xml')){
    let d=await zip.file('xl/drawings/drawing1.xml').async('string');
    d=d.replace(/<xdr:row>(\d+)<\/xdr:row>/g,(_,r)=>`<xdr:row>${R(+r+1)-1}</xdr:row>`);
    zip.file('xl/drawings/drawing1.xml',d);
  }
  if(zip.file('xl/media/image2.jpeg'))zip.file('xl/media/image2.jpeg',data.firma||BLANK_JPG,{base64:!data.firma});

  // libro: área de impresión, recálculo al abrir, sin calcChain
  let wbx=await zip.file('xl/workbook.xml').async('string');
  wbx=wbx.replace(/(\$[A-Z]+\$)(\d+)(<\/definedName>)/g,(_,a,r,b)=>a+(+r+totalExtra)+b);
  wbx=wbx.replace(/<calcPr ([^>]*?)\/>/,(m0,a)=>/fullCalcOnLoad/.test(a)?m0:`<calcPr ${a} fullCalcOnLoad="1"/>`);
  zip.file('xl/workbook.xml',wbx);
  if(zip.file('xl/calcChain.xml')){
    zip.remove('xl/calcChain.xml');
    let rel=await zip.file('xl/_rels/workbook.xml.rels').async('string');rel=rel.replace(/<Relationship [^>]*calcChain[^>]*\/>/,'');zip.file('xl/_rels/workbook.xml.rels',rel);
    let ct=await zip.file('[Content_Types].xml').async('string');ct=ct.replace(/<Override PartName="\/xl\/calcChain.xml"[^>]*\/>/,'');zip.file('[Content_Types].xml',ct);
  }
  return zip.generateAsync({type:typeof window==='undefined'?'nodebuffer':'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const CLAVES={

const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function clasificar(texto){
  const t=' '+norm(texto).replace(/[^a-z0-9ñ.\s]/g,' ').replace(/\s+/g,' ')+' ';
  const pts={};let best='Otros',bp=0;
  for(const [cat,lista] of Object.entries(CLAVES)){
    let p=0;for(const raw of lista){const strong=raw[0]==='!';const k=strong?raw.slice(1):raw;
      const re=new RegExp('(^|[^a-z0-9])'+escRe(k)+'(?=$|[^a-z0-9])','g');const n=(t.match(re)||[]).length;if(n)p+=(strong?3:1)*Math.min(n,3)}
    pts[cat]=p;if(p>bp){bp=p;best=cat}
  }
  return {categoria:bp>=3?(NOMBRES[best]||best):'Otros',puntos:pts};
}

function rutValido(r){r=r.replace(/[^0-9kK]/g,'').toUpperCase();if(r.length<2)return false;const b=r.slice(0,-1),dv=r.slice(-1);let s=0,m=2;for(let i=b.length-1;i>=0;i--){s+=+b[i]*m;m=m===7?2:m+1}const e=11-(s%11);return (e===11?'0':e===10?'K':String(e))===dv}
const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12};
function fechaValida(d,m,y,hoy){if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<2015)return null;const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)return null;const lim=new Date(hoy.getTime()+3*864e5);if(dt>lim)return null;if(dt<new Date(hoy.getFullYear()-2,0,1))return null;return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function montoDe(s){const v=parseInt(String(s).replace(/[.,\s]/g,''),10);return isFinite(v)?v:0}

function analizar(texto,hoy=new Date()){
  const raw=String(texto||'');const lineas=raw.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const n=norm(raw);const out={tipo:null,numero:null,fecha:null,casa:null,monto:null,categoria:'Otros',rut:null};
  // tipo
  if(/factura\s*(electronica|afecta|exenta)?/.test(n)&&!/boleta/.test(n.slice(0,400)))out.tipo='Factura';
  else if(/factura\s+electronica/.test(n))out.tipo='Factura';
  else out.tipo='Boleta';
  // número / folio
  const NS='\\bn(?:ro|um|umero)?\\s*[^a-z0-9\\s]{0,2}\\s*:?\\s*';
  const pats=[new RegExp('(?:factura|boleta)[^\\n]{0,30}?'+NS+'(\\d{2,10})'),new RegExp('(?:factura|boleta)[^\\n]{0,40}\\n\\s*'+NS+'(\\d{2,10})'),/folio\s*(?:n\s*[^a-z0-9\s]{0,2})?\s*:?\s*(\d{2,10})/,new RegExp('(?:^|\\n)\\s*'+NS+'(\\d{3,10})'),/\bn\s*[°º*”"']\s*:?\s*(\d{3,10})/];
  for(const p of pats){const m=n.match(p);if(m){out.numero=m[1];break}}
  // fecha
  const fechas=[];let m;
  const reN=/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4}|\d{2})(?!\d)/g;while((m=reN.exec(n)))fechas.push([+m[1],+m[2],+m[3],m.index]);
  const reI=/(\d{4})-(\d{2})-(\d{2})/g;while((m=reI.exec(n)))fechas.push([+m[3],+m[2],+m[1],m.index]);
  const reM=/(\d{1,2})\s*(?:de\s+)?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-z]*\.?\s*(?:de(?:l)?\s+)?(\d{4})/g;while((m=reM.exec(n)))fechas.push([+m[1],MESES[m[2]],+m[3],m.index]);
  fechas.sort((a,b)=>a[3]-b[3]);
  const emision=n.search(/fecha\s*(de\s*)?emision|fecha\s*:/);
  const orden=emision>=0?[...fechas.filter(f=>f[3]>=emision),...fechas.filter(f=>f[3]<emision)]:fechas;
  for(const f of orden){const v=fechaValida(f[0],f[1],f[2],hoy);if(v){out.fecha=v;break}}
  // rut emisor
  const reR=/(\d{1,2}[.\s]?\d{3}[.\s]?\d{3})\s*-\s*([\dkK])/g;while((m=reR.exec(raw))){if(rutValido(m[1]+m[2])){out.rut=m[1].replace(/\s/g,'')+'-'+m[2].toUpperCase();break}}
  // monto total
  const reMonto=/\$?\s*(\d{1,3}(?:[.,]\d{3})+|\d{2,8})(?![\d.,]*\d)/g;
  const cands=[];
  lineas.forEach((l,i)=>{const ln=norm(l);
    if(/\btotal\b|a pagar|monto pagado|importe|total\s*\$/.test(ln)&&!/sub\s*-?\s*total|neto|iva|exento|propina|descuento|ahorro|vuelto|items?\b|articulos|cantidad/.test(ln)){
      let am=[...l.matchAll(reMonto)].map(x=>montoDe(x[1])).filter(v=>v>=50&&v<20000000);
      if(!am.length&&lineas[i+1])am=[...lineas[i+1].matchAll(reMonto)].map(x=>montoDe(x[1])).filter(v=>v>=50&&v<20000000);
      if(am.length)cands.push(am[am.length-1]);
    }});
  if(cands.length)out.monto=Math.max(...cands);
  else{const all=lineas.filter(l=>!/rut|r\.u\.t|fono|tel|fecha|hora|folio|n[°º]/i.test(norm(l))).flatMap(l=>[...l.matchAll(/\$\s*(\d{1,3}(?:[.,]\d{3})+|\d{3,8})/g)].map(x=>montoDe(x[1])));if(all.length)out.monto=Math.max(...all)}
  // casa comercial
  for(const [k,v] of MARCAS){if(new RegExp('(^|[^a-z])'+escRe(k)+'([^a-z]|$)').test(n)){out.casa=v;break}}
  if(!out.casa){
    const skip=/rut|r\.u\.t|boleta|factura|electronica|giro|direccion|fecha|hora|s\.?i\.?i|www|http|fono|telefono|casa matriz|sucursal|comuna|santiago|caja|cajero|vendedor|folio|res\.|resolucion|timbre|\d{4,}/;
    for(const l of lineas.slice(0,8)){const ln=norm(l).trim();const letras=(ln.match(/[a-zñ]/g)||[]).length;
      if(letras>=3&&letras/ln.length>0.6&&!skip.test(ln)){out.casa=l.replace(/\s+/g,' ').replace(/[^\wÁÉÍÓÚÑáéíóúñ&.,\- ]/g,'').trim().toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()).slice(0,60);break}}
  }
  const c=clasificar(raw);out.categoria=c.categoria;out.puntos=c.puntos;
  return out;
}
if(typeof module!=='undefined')module.exports={analizar,clasificar};

function seccionDe(g){

/* ---------- almacenamiento local (IndexedDB, con respaldo en memoria) ---------- */
const store={db:null,mem:{kv:{},img:{}}};
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('rendicion-fondos',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('img')};r.onsuccess=()=>{store.db=r.result;res()};r.onerror=()=>res();r.onblocked=()=>res()}catch(e){res()}})}
function idb(name,mode,fn){return new Promise(res=>{try{const tx=store.db.transaction(name,mode);const req=fn(tx.objectStore(name));req.onsuccess=()=>res(req.result);req.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
const kvGet=async k=>store.db?await idb('kv','readonly',s=>s.get(k)):store.mem.kv[k];
const kvSet=(k,v)=>{store.mem.kv[k]=v;return store.db?idb('kv','readwrite',s=>s.put(v,k)):Promise.resolve()};
const imgGet=async k=>store.mem.img[k]||(store.db?await idb('img','readonly',s=>s.get(k)):undefined);
const imgSet=(k,v)=>{store.mem.img[k]=v;return store.db?idb('img','readwrite',s=>s.put(v,k)):Promise.resolve()};

const urlCache={};

/* ---------- capacidades del visor ---------- */
/* lector de texto (OCR) en el propio teléfono: se descarga una vez y queda en caché */
let ocrWorker=null;let ocrCb=null;
async function ocr(blob,onProg){
  ocrCb=onProg;
  if(!ocrWorker){onProg('Preparando el lector (solo la primera vez, unos segundos)…');
    ocrWorker=Tesseract.createWorker('spa',1,{logger:m=>{if(!ocrCb)return;if(m.status==='recognizing text')ocrCb('Leyendo el documento… '+Math.round(m.progress*100)+'%');else if(/load|download/i.test(m.status))ocrCb('Preparando el lector (solo la primera vez)… '+(m.progress?Math.round(m.progress*100)+'%':''))}})
      .catch(e=>{ocrWorker=null;throw e});}
  const w=await ocrWorker;
  const c=await prepOCR(blob);
  const {data}=await w.recognize(c);
  ocrCb=null;return data.text||'';
}
/* escala de grises, contraste y tamaño adecuado para leer texto pequeño */
async function prepOCR(blob){
  const img=await loadImg(blob);let w=img.naturalWidth,h=img.naturalHeight;
  const s=Math.min(2200/Math.max(w,h),Math.max(1,1400/Math.min(w,h)));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data;let lo=255,hi=0;const lum=new Uint8ClampedArray(w*h);
  for(let i=0,k=0;i<p.length;i+=4,k++){const l=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];lum[k]=l}
  const hist=new Uint32Array(256);lum.forEach(v=>hist[v]++);let acc=0;for(let v=0;v<256;v++){acc+=hist[v];if(acc>lum.length*0.02){lo=v;break}}acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>lum.length*0.02){hi=v;break}}
  const r=Math.max(1,hi-lo);for(let i=0,k=0;i<p.length;i+=4,k++){const v=Math.max(0,Math.min(255,(lum[k]-lo)*255/r));p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(d,0,0);return c;
}

  $('#gCam').onchange=onF;$('#gGal').onchange=onF;

  $('#gClose').onclick=close;if($('#gCancel'))$('#gCancel').onclick=close;

    await save();close();render();toast(g.img?'Gasto guardado':'Gasto guardado sin foto: agrégala antes de exportar');
  };
}


/* ---------- imágenes ---------- */
async function loadImg(blob){const u=URL.createObjectURL(blob);try{return await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}finally{setTimeout(()=>URL.revokeObjectURL(u),0)}}
async function compress(file){
  try{
    const img=await loadImg(file);
    let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,1700/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.78));
  }catch(e){return file}
}
/* firma: fondo blanco limpio y proporción del espacio de firma del formato */
async function procesarFirma(file){
  const img=await loadImg(file);
  const W=900,H=485,top=Math.round(H*0.12043),pad=24;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  const bw=W-2*pad,bh=H-top-2*pad;const s=Math.min(bw/img.naturalWidth,bh/img.naturalHeight);
  const w=img.naturalWidth*s,h=img.naturalHeight*s;x.drawImage(img,(W-w)/2,top+pad+(bh-h)/2,w,h);
  const d=x.getImageData(0,0,W,H),p=d.data;
  for(let i=0;i<p.length;i+=4){const l=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];if(l>150){p[i]=p[i+1]=p[i+2]=255}else{const v=Math.max(0,l-40);p[i]=p[i+1]=p[i+2]=v}}
  x.putImageData(d,0,0);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
}
async function blobToJpegData(blob){
  const img=await loadImg(blob);
  const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0);
  return {data:c.toDataURL('image/jpeg',0.8),w:c.width,h:c.height};
}

/* ---------- exportación ---------- */
function descargar(blob,filename){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function exportar(tipo){
  const r=rend();const msg=$('#exMsg');
  if(!r.gastos.length){toast('Agrega al menos un gasto antes de exportar');return}
  const sinFoto=r.gastos.filter(g=>!g.img).length;
  const base=`Rendicion${r.numero?'_N'+slug(r.numero):''}_${slug(r.proyecto)}_${fFecha(r.fecha)}`;
  msg.textContent='Generando archivo…';
  try{
    let data,filename;
    if(tipo==='xlsx'){data=await buildXlsx(r);filename=base+'.xlsx'}
    else{data=await buildPdf(r);filename=base+'_respaldos.pdf'}
    descargar(data,filename);
    let extra='';
    if(tipo==='xlsx'&&!S.perfil.nombre)extra=' Falta tu nombre (Ajustes).';
    if(tipo==='pdf'&&sinFoto)extra=` Ojo: ${sinFoto} gasto${sinFoto>1?'s':''} sin foto.`;
    if(tipo==='pdf'&&saldo(r)>0&&!r.devolucion.img)extra+=' Falta el comprobante de transferencia.';
    msg.textContent='Archivo listo: '+filename+'.'+extra;
  }catch(e){
    const c=e&&e.code;
    msg.textContent=c==='declined'?'Descarga cancelada.':c==='rate_limited'?'Ya hay una descarga en curso. Espera un momento.':'No se pudo generar el archivo. Intenta de nuevo.';
    if(!c)console.error(e);
  }
}

async function buildXlsx(r){
  const grupos=agrupar(r),secciones={};
  for(const k in grupos)secciones[k]=grupos[k].map(g=>({casa:g.proveedor,fecha:fFecha(g.fecha),numero:g.numero,monto:+g.monto||0,obs:obsDe(g)}));
  let firma=null;
  if(S.perfil.firma){const b=await imgGet(S.perfil.firma);if(b)firma=new Uint8Array(await b.arrayBuffer())}
  const bin=Uint8Array.from(atob(PLANTILLA_B64),c=>c.charCodeAt(0));
  return await llenarPlantilla(JSZip,bin,{trabajador:S.perfil.nombre,numero:r.numero,proyecto:r.proyecto,monto:+r.fondo||0,fechaEntrega:fFecha(r.fechaEntrega),fechaRendicion:fFecha(r.fecha),secciones,firma});
}

async function buildPdf(r){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=14;const grupos=agrupar(r);
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Respaldos de rendición de gastos',M,22);
  doc.setFont('helvetica','normal');doc.setFontSize(11);
  const sd=saldo(r);
  const info=[['Trabajador',S.perfil.nombre||'—'],['Rendición N°',r.numero||'—'],['Proyecto',r.proyecto],['Fecha entrega recursos',fFecha(r.fechaEntrega)||'—'],['Fecha entrega rendición',fFecha(r.fecha)],['Monto asignado',clp(r.fondo)],['Fondo rendido',clp(totalG(r))],['Saldo',sd>0?clp(sd)+' devolución a empresa':sd<0?clp(-sd)+' a reembolsar al trabajador':'$ 0']];
  let y=34;info.forEach(([k,v])=>{doc.setFont('helvetica','bold');doc.text(k+':',M,y);doc.setFont('helvetica','normal');doc.text(String(v),M+50,y);y+=7});
  y+=4;doc.setFontSize(10);
  for(const sec of SECCIONES){const gs=grupos[sec.key];if(!gs.length)continue;
    if(y>H-30){doc.addPage();y=20}
    doc.setFont('helvetica','bold');doc.text(SEC_INFO[sec.key],M,y);y+=2;doc.line(M,y,W-M,y);y+=5;doc.setFont('helvetica','normal');
    gs.forEach((g,i)=>{if(y>H-20){doc.addPage();y=20}
      doc.text(String(i+1),M,y);doc.text(fFecha(g.fecha),M+8,y);doc.text(doc.splitTextToSize('N° '+(g.numero||'—'),30)[0],M+32,y);doc.text(doc.splitTextToSize(g.proveedor||'',90)[0],M+64,y);doc.text(clp(g.monto),W-M,y,{align:'right'});y+=6});
    y+=3;
  }
  const page=async(title,sub,blob)=>{
    doc.addPage();doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text(title,M,16);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text(doc.splitTextToSize(sub,W-2*M).slice(0,2),M,22);
    if(!blob){doc.setTextColor(150);doc.text('Sin imagen adjunta',M,40);doc.setTextColor(0);return}
    const im=await blobToJpegData(blob);const top=32,maxW=W-2*M,maxH=H-top-M;const s=Math.min(maxW/im.w,maxH/im.h);const w=im.w*s,h=im.h*s;
    doc.addImage(im.data,'JPEG',M+(maxW-w)/2,top,w,h,undefined,'FAST');
  };
  for(const sec of SECCIONES){const gs=grupos[sec.key];
    for(let i=0;i<gs.length;i++){const g=gs[i];
      await page(`${SEC_INFO[sec.key]} · N° ${i+1} · ${clp(g.monto)}`,`${fFecha(g.fecha)} · ${g.proveedor||''} · Doc. ${g.numero||'—'}${g.descripcion?' · '+g.descripcion:''}`,g.img?await imgGet(g.img):null)}}
  if(sd>0)await page(`Comprobante de devolución · ${clp(r.devolucion.monto||sd)}`,`Transferencia a la empresa${r.devolucion.fecha?' del '+fFecha(r.devolucion.fecha):''} por saldo no utilizado de ${clp(sd)}.`,r.devolucion.img?await imgGet(r.devolucion.img):null);
  return doc.output('blob');
}

  if(!S||!Array.isArray(S.rendiciones)){S=ejemplo();save()}else S=normalizar(S);
